# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/miniprogram?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
# 数据库密码通过环境变量 DB_PASSWORD 注入，切勿在此写明文
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 管理员账号（生产环境请用环境变量 ADMIN_USERNAME / ADMIN_PASSWORD 覆盖默认值）
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:123456}

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.miniprogram.miniprogram.entity

# 端口
server.port=8080

# Thymeleaf 配置
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
