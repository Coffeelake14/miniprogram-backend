<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>管理员登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: url('/admin/background.jpg') no-repeat center/cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 半透明遮罩 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }
        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 40px;
            width: 360px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #5a67d8;
        }
        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h2>后台管理登录</h2>
    <form id="loginForm">
        <div class="input-group">
            <label>用户名</label>
            <input type="text" id="username" required>
        </div>
        <div class="input-group">
            <label>密码</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">登 录</button>
        <div class="error" id="errorMsg">用户名或密码错误</div>
    </form>
</div>

<script>
    document.getElementById('loginForm').onsubmit = function(e) {
        e.preventDefault();
        var user = document.getElementById('username').value;
        var pass = document.getElementById('password').value;

        if (user === 'admin' && pass === '123456') {
            window.location.href = '/admin/dashboard.html';
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    };
</script>
</body>
</html>
